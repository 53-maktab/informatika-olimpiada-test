<style>
:root{
  --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#65708a; --line:#e2e7f1;
  --primary:#2f5bea; --primary-d:#2447c4; --primary-l:#e8eeff;

    --primary:#6d8dff; --primary-d:#8aa4ff; --primary-l:#212c4f;
    --ok:#4ade80; --ok-l:#143222; --bad:#ff8a8a; --bad-l:#3a1c22; --warn:#fbbf24; --warn-l:#3a2f14;

}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:16px}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .4em;line-height:1.25}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.wrap.wide{max-width:1180px}
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:700;display:flex;align-items:center;gap:8px}
.brand small{color:var(--muted);font-weight:500}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.93rem}
.who b{color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:8px}
.btn.lg{padding:13px 26px;font-size:1.05rem}
label.f{display:block;margin-bottom:14px;font-weight:600;font-size:.93rem}
input[type=text],input[type=password],input[type=number],input[type=search],select{width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
.err{color:var(--bad);font-size:.92rem;min-height:1.3em;margin:4px 0}
.muted{color:var(--muted)}
.center{text-align:center}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login .card{width:100%;max-width:400px;padding:28px}

.qtext{font-size:1.2rem;margin-bottom:16px;white-space:pre-wrap}

.qn.done{background:var(--primary-l);border-color:var(--primary-l);color:var(--primary)}
.qn.cur{border-color:var(--primary);background:var(--primary);color:#fff}

.ro.mine-bad{background:var(--bad-l);border-color:var(--bad)}

.ro.correct .tag{color:var(--ok)} .ro.mine-bad .tag{color:var(--bad)}

.tab.on{color:var(--primary);border-bottom-color:var(--primary)}

.toolbar label{font-size:.8rem;font-weight:700;color:var(--muted)}

.stat span{font-size:.8rem;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem;white-space:nowrap}
th{background:var(--bg);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);position:sticky;top:0}
th.s{cursor:pointer;user-select:none} th.s:hover{color:var(--primary)}
tr:last-child td{border-bottom:0}
.act{display:flex;gap:6px}
.score{font-weight:800}

.md{background:var(--card);border-radius:16px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:90vh;overflow:auto}

.toast{background:#1c2333;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:.93rem}

.pwbox{font-family:ui-monospace,Consolas,monospace;font-size:1.5rem;font-weight:800;background:var(--primary-l);color:var(--primary);padding:12px;border-radius:10px;text-align:center;letter-spacing:.06em;margin:10px 0;user-select:all}
@media (max-width:560px){.wrap{padding:12px}.card{padding:16px}.big{font-size:2.4rem}.qtext{font-size:1.08rem}}
</style>

async function rpc(fn, params = {}) {
  let res;

    res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {

  const onKey = ev => { if (ev.key === 'Escape') { close(); if (ov._onEsc) ov._onEsc(); } };

  return { el: ov, close, root: $('.md', ov), onEsc: f => { ov._onEsc = f; } };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(arr, seed) {

  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

async function startTest() {
  try {
    const d = await rpc('app_start_test', { p_token: S.token });
    beginTest(d);
  } catch (e) {
    toast(errMsg(e), true);
    try { await refreshMe(); showStudentHome(); } catch (_) { /* sessiya tugagan bo'lishi mumkin */ }
  }
}

function beginTest(d) {
  const key = 'ans_' + d.attempt_id;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) { saved = {}; }
  const qs = shuffled(d.questions, d.attempt_id * 7919 + 13);
  const valid = new Set(qs.map(q => String(q.id)));
  const answers = {};
  Object.keys(saved).forEach(k => { if (valid.has(k) && Number.isInteger(saved[k])) answers[k] = saved[k]; });
  const offset = Date.parse(d.server_now) - Date.now();
  T = { attemptId: d.attempt_id, key, qs, answers, i: 0, submitting: false,
        deadline: d.duration_minutes > 0 ? Date.parse(d.started_at) + d.duration_minutes * 60000 : null, offset };
  window.onbeforeunload = () => 'Test yakunlanmagan!';
  renderTest();
  stopTimer();
  if (T.deadline) { tick(); timerId = setInterval(tick, 500); }
}

function tick() {
  if (!T || !T.deadline) return;
  const left = T.deadline - (Date.now() + T.offset);
  const el = $('#timer');
  if (left <= 0) {
    stopTimer(); if (el) el.textContent = '00:00';
    if (!T.expired) { T.expired = true; toast('Vaqt tugadi. Javoblar yuborilmoqda…', true); finishTest(true); }
    return;
  }
  const s = Math.ceil(left / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const p = n => String(n).padStart(2, '0');
  if (el) { el.textContent = (h ? h + ':' : '') + p(m) + ':' + p(sec); el.classList.toggle('low', s <= 60); }
}

function saveLocal() { try { localStorage.setItem(T.key, JSON.stringify(T.answers)); } catch (e) { /* xotira to'la */ } }

function renderTest() {
  const q = T.qs[T.i], n = T.qs.length, done = Object.keys(T.answers).length;
  const last = T.i === n - 1;
  app.innerHTML = `${topbar(`<span><b>${esc(S.user.full_name)}</b> · ${esc(S.user.class_name)}</span>${T.deadline ? '<span class="timer" id="timer">…</span>' : ''}`)}
    <main class="wrap">
      <div class="progress"><div style="width:${(done / n) * 100}%"></div></div>
      <div class="qmeta"><span>Savol <b>${T.i + 1}</b> / ${n}</span><span>Javob berilgan: <b>${done}</b> / ${n}</span></div>
      <div class="card"><h2 class="qtext">${esc(q.question)}</h2>
        <div class="opts" role="radiogroup">${q.options.map((o, k) => `
          <button class="opt ${T.answers[q.id] === k ? 'sel' : ''}" role="radio" aria-checked="${T.answers[q.id] === k}" data-k="${k}">
            <span class="badge">${LET[k]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>
      <div class="nav">
        <button class="btn" id="prev" ${T.i === 0 ? 'disabled' : ''}>← Oldingi</button>
        ${last ? '<button class="btn primary" id="fin2">Yakunlash ✓</button>' : '<button class="btn primary" id="next">Keyingi →</button>'}
      </div>
      <div class="card"><div class="muted" style="margin-bottom:10px;font-size:.9rem">Savollar ro'yxati (o'tish uchun bosing)</div>
        <div class="grid">${T.qs.map((x, j) => `<button class="qn ${j === T.i ? 'cur' : ''} ${T.answers[x.id] !== undefined && j !== T.i ? 'done' : ''}" data-j="${j}">${j + 1}</button>`).join('')}</div></div>
      <div class="center" style="margin:6px 0 30px"><button class="btn" id="finish">Testni yakunlash</button></div>
    </main>`;
  $$('.opt').forEach(b => b.onclick = () => { T.answers[q.id] = +b.dataset.k; saveLocal(); renderTest(); });
  $$('.qn').forEach(b => b.onclick = () => { T.i = +b.dataset.j; renderTest(); window.scrollTo(0, 0); });
  const pv = $('#prev'), nx = $('#next');
  if (pv) pv.onclick = () => { T.i--; renderTest(); window.scrollTo(0, 0); };
  if (nx) nx.onclick = () => { T.i++; renderTest(); window.scrollTo(0, 0); };
  $('#finish').onclick = () => finishTest(false);
  const f2 = $('#fin2'); if (f2) f2.onclick = () => finishTest(false);
  tick();
}

async function finishTest(auto) {
  if (!T || T.submitting) return;
  const left = T.qs.length - Object.keys(T.answers).length;
  if (!auto) {
    const yes = await confirmModal({ title: 'Testni yakunlaysizmi?',
      body: `<p>${left ? `Javob berilmagan savollar: <b>${left} ta</b>. ` : 'Barcha savollarga javob berdingiz. '}Yakunlagach javoblarni o'zgartirib bo'lmaydi.</p>`,
      ok: 'Ha, yakunlash', cancel: 'Yo\'q, davom etaman' });
    if (!yes) return;
  }
  T.submitting = true;
  app.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    await rpc('app_submit_test', { p_token: S.token, p_answers: T.answers });
    try { localStorage.removeItem(T.key); } catch (e) { /* ok */ }
    stopTimer(); window.onbeforeunload = null; T = null;
    try { await refreshMe(); } catch (e) { /* ok */ }
    showResult();
  } catch (e) {
    if (e.message === 'already_submitted' || e.message === 'no_active_attempt') {
      stopTimer(); window.onbeforeunload = null; T = null;
      toast(errMsg(e), true); try { await refreshMe(); } catch (_) { /* ok */ } showStudentHome(); return;
    }
    T.submitting = false; renderTest();
    toast(errMsg(e) + ' Javoblaringiz saqlangan.', true);
    if (auto) setTimeout(() => { if (T) finishTest(true); }, 4000);
  }
}

function renderReview(r, opt) {
  let filter = 'all';
  const p = pct(r.score, r.total), wrong = r.review.filter(x => x.chosen !== null && !x.is_correct).length;
  const skipped = r.review.filter(x => x.chosen === null).length;
  const right = r.review.filter(x => x.is_correct).length;
  const bar = opt.teacher
    ? topbar(`<span><b>${esc(S.user.full_name)}</b></span><button class="btn sm" id="back">← Natijalar jadvali</button>`)
    : topbar(`<span><b>${esc(S.user.full_name)}</b> · ${esc(S.user.class_name)}</span><button class="btn sm" id="back">← Bosh sahifa</button><button class="btn sm" id="lo">Chiqish</button>`);
  app.innerHTML = `${bar}<main class="wrap">
    <div class="card"><div class="summary">
      <div class="ring" style="--p:${p}"><div>${p}%</div></div>
      <div>${opt.teacher ? `<div class="muted">${esc(r.full_name)} · ${esc(r.class_name)}</div>` : '<div class="muted">Sizning natijangiz</div>'}
        <div class="big">${r.score} <span class="muted" style="font-size:1.4rem">/ ${r.total}</span></div>
        <div style="margin-top:8px"><span class="pill ok">To'g'ri: ${right}</span> <span class="pill bad">Xato: ${wrong}</span>
        ${skipped ? `<span class="pill warn">Javobsiz: ${skipped}</span>` : ''}
        ${r.late ? '<span class="pill warn">vaqtdan kech</span>' : ''}</div>
        <div class="muted" style="margin-top:6px;font-size:.9rem">Topshirilgan: ${fmtDate(r.submitted_at)}</div></div></div></div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="all">Hammasi (${r.review.length})</button>
      <button class="chip" data-f="wrong">Xatolar (${wrong + skipped})</button>
      <button class="chip" data-f="good">To'g'ri (${right})</button></div>
    <div id="list"></div></main>`;
  $('#back').onclick = () => (opt.teacher ? showTeacher(true) : showStudentHome());
  const lo = $('#lo'); if (lo) lo.onclick = logout;
  const draw = () => {
    const items = r.review.filter(x => filter === 'all' || (filter === 'good' ? x.is_correct : !x.is_correct));
    $('#list').innerHTML = items.length ? items.map(x => {
      const cls = x.is_correct ? 'good' : x.chosen === null ? 'skip' : 'wrong';
      return `<div class="card rq ${cls}"><div class="qh">${x.num}. ${esc(x.question)}</div>
        ${x.options.map((o, k) => {
          const isC = k === x.correct, isM = k === x.chosen;
          const c = isC ? 'correct' : (isM ? 'mine-bad' : '');
          const tag = isC && isM ? "✓ Sizning javobingiz (to'g'ri)" : isC ? "✓ To'g'ri javob" : isM ? '✗ Sizning javobingiz' : '';
          return `<div class="ro ${c}"><span class="badge">${LET[k]}</span><span>${esc(o)}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</div>`;
        }).join('')}
        ${x.chosen === null ? '<div class="muted" style="font-size:.88rem;margin-top:4px">Bu savolga javob berilmagan.</div>' : ''}</div>`;
    }).join('') : '<div class="card center muted">Bu bo\'limda savollar yo\'q 🎉</div>';
  };
  $$('#chips .chip').forEach(b => b.onclick = () => {
    filter = b.dataset.f; $$('#chips .chip').forEach(x => x.classList.toggle('on', x === b)); draw();
  });
  draw(); window.scrollTo(0, 0);
}

async function loadTeacherData() {
  const [rows, tests] = await Promise.all([rpc('t_results', { p_token: S.token }), rpc('t_get_tests', { p_token: S.token })]);
  TR.rows = rows; TR.tests = tests;
}

function drawTeacherTab() {
  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === TR.tab));
  if (TR.tab === 'set') drawSettings(); else drawResults();
}

function filteredRows() {
  const f = TR.f, q = f.q.trim().toLowerCase();
  let rows = TR.rows.filter(r =>
    (!f.cls || r.class_name === f.cls) &&
    (!f.grp || String(r.grp) === f.grp) &&
    (!f.st || r.status === f.st) &&
    (!q || r.full_name.toLowerCase().includes(q) || r.username.includes(q)));
  const k = TR.sort.k, d = TR.sort.d;
  if (k) rows = rows.slice().sort((a, b) => {
    let x, y;
    if (k === 'name') { x = a.full_name.toLowerCase(); y = b.full_name.toLowerCase(); }
    else if (k === 'score') { x = a.status === 'submitted' ? pct(a.score, a.total) : -1; y = b.status === 'submitted' ? pct(b.score, b.total) : -1; }
    else if (k === 'date') { x = a.submitted_at || ''; y = b.submitted_at || ''; }
    else { x = a.class_name + (a.grp || 0); y = b.class_name + (b.grp || 0); }
    return (x < y ? -1 : x > y ? 1 : 0) * d;
  });
  return rows;
}

  in_progress: '<span class="pill warn">Jarayonda</span>',
  not_started: '<span class="pill gray">Topshirmagan</span>'
};

    const k = th.dataset.k; TR.sort = { k, d: TR.sort.k === k ? -TR.sort.d : 1 }; drawRows();
  });

}

function drawRows() {
  const rows = filteredRows();
  const done = rows.filter(r => r.status === 'submitted');
  const avg = done.length ? Math.round(done.reduce((s, r) => s + pct(r.score, r.total), 0) / done.length) : null;
  const best = done.length ? Math.max(...done.map(r => pct(r.score, r.total))) : null;
  $('#stats').innerHTML = `
    <div class="stat"><b>${rows.length}</b><span>Ro'yxatda</span></div>
    <div class="stat"><b>${done.length}</b><span>Topshirgan</span></div>
    <div class="stat"><b>${rows.length - done.length}</b><span>Topshirmagan</span></div>
    <div class="stat"><b>${avg === null ? '—' : avg + '%'}</b><span>O'rtacha natija</span></div>
    <div class="stat"><b>${best === null ? '—' : best + '%'}</b><span>Eng yuqori</span></div>`;
  $('#tb').innerHTML = rows.length ? rows.map((r, i) => {
    const p = pct(r.score, r.total), sub = r.status === 'submitted';
    return `<tr data-id="${r.id}"><td>${i + 1}</td><td><b>${esc(r.full_name)}</b></td><td>${esc(r.class_name)}${r.grp ? ' · ' + r.grp + '-guruh' : ''}</td><td><code>${esc(r.username)}</code></td>
      <td>${STATUS[r.status]}${r.late ? ' <span class="pill warn">kech</span>' : ''}${r.attempts > 1 ? ` <span class="muted" title="Urinishlar soni">×${r.attempts}</span>` : ''}</td>
      <td>${sub ? `<span class="score ${scoreCls(p)}">${r.score}/${r.total}</span>` : '—'}</td>
      <td>${sub ? p + '%' : '—'}</td><td>${fmtDate(r.submitted_at)}</td>
      <td><div class="act">${sub ? '<button class="btn sm" data-a="view">Javoblar</button>' : ''}
        ${r.status !== 'not_started' ? '<button class="btn sm" data-a="reopen">Qayta ochish</button>' : ''}
        <button class="btn sm" data-a="pw">Parol</button></div></td></tr>`;
  }).join('') : '<tr><td colspan="9" class="center muted" style="padding:24px">Hech narsa topilmadi</td></tr>';
  $$('#tb button').forEach(b => b.onclick = () => {
    const id = b.closest('tr').dataset.id, row = TR.rows.find(x => x.id === id);
    if (b.dataset.a === 'view') viewStudent(row);
    else if (b.dataset.a === 'reopen') reopen(row);
    else resetPw(row);
  });
}

  });
}

    <label class="f">Joriy parol<input type="password" id="o" autocomplete="current-password"></label>
    <label class="f">Yangi parol (kamida 8 belgi)<input type="password" id="n" autocomplete="new-password"></label>
    <label class="f">Yangi parolni takrorlang<input type="password" id="n2" autocomplete="new-password"></label>
    <div class="err" id="me"></div>
    <div class="btns"><button class="btn" data-x="no">Bekor qilish</button><button class="btn primary" data-x="yes">Saqlash</button></div>`);
  m.root.addEventListener('click', async ev => {
    const x = ev.target.closest('[data-x]'); if (!x) return;
    if (x.dataset.x === 'no') return m.close();
    const o = $('#o', m.root).value, n = $('#n', m.root).value, n2 = $('#n2', m.root).value, er = $('#me', m.root);
    if (n.length < 8) { er.textContent = 'Yangi parol kamida 8 belgidan iborat bo\'lsin.'; return; }
    if (n !== n2) { er.textContent = 'Yangi parollar bir xil emas.'; return; }
    x.disabled = true;
    try { await rpc('app_change_password', { p_token: S.token, p_old: o, p_new: n }); m.close(); toast('Parol o\'zgartirildi'); }
    catch (e) { x.disabled = false; er.textContent = errMsg(e); }
  });
}

function exportCsv() {
  const rows = filteredRows();
  const cell = v => { v = String(v ?? ''); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const head = ['№', 'F.I.SH', 'Sinf', 'Guruh', 'Login', 'Holat', 'Ball', 'Jami', 'Foiz', 'Topshirilgan vaqt'];
  const lines = [head.join(';')];
  const ST = { submitted: 'Topshirgan', in_progress: 'Jarayonda', not_started: 'Topshirmagan' };
  rows.forEach((r, i) => lines.push([i + 1, r.full_name, r.class_name, r.grp || '', r.username, ST[r.status],
    r.status === 'submitted' ? r.score : '', r.status === 'submitted' ? r.total : '',
    r.status === 'submitted' ? pct(r.score, r.total) + '%' : '', r.submitted_at ? fmtDate(r.submitted_at) : ''].map(cell).join(';')));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'informatika_natijalar.csv'; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

init();
